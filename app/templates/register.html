{% extends "base.html" %}

{% block title %}Crear cuenta{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto bg-white p-8 rounded-lg shadow-md">
  <h1 class="text-3xl font-bold text-gray-800 mb-6">Crear cuenta</h1>

  {% if error %}
    <div class="mb-4 p-3 bg-red-100 text-red-700 rounded-md text-sm">
      {{ error }}
    </div>
  {% endif %}

  <form method="post" class="space-y-4" id="registerForm">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
      <input 
        type="text" 
        name="username" 
        minlength="3"
        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        required
      >
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
      <input 
        type="password" 
        name="password" 
        minlength="8"
        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        required
      >
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Rol</label>
      <select 
        id="role" 
        name="role"
        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        required
      >
        <option value="">Selecciona un rol</option>
        <option value="alumno">Alumno</option>
        <option value="profesor">Profesor</option>
      </select>
    </div>

    <!-- Campos para Alumno -->
    <fieldset id="alumno-fields" hidden class="border border-gray-300 p-4 rounded-md">
      <legend class="text-sm font-semibold text-gray-700 mb-3">Datos para Alumno</legend>
      <div class="space-y-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Número de cuenta</label>
          <input 
            type="text" 
            id="num_cuenta" 
            name="num_cuenta" 
            inputmode="numeric" 
            maxlength="10"
            pattern="\d{10}"
            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Carrera</label>
          <select 
            id="carrera" 
            name="carrera"
            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
            <option value="">Selecciona una carrera</option>
            <option value="matematicas">Matemáticas</option>
            <option value="computacion">Computación</option>
            <option value="actuaria">Actuaría</option>
            <option value="fisica">Física</option>
          </select>
        </div>
      </div>
    </fieldset>

    <!-- Campos para Profesor -->
    <fieldset id="staff-fields" hidden class="border border-gray-300 p-4 rounded-md">
      <legend class="text-sm font-semibold text-gray-700 mb-3">Datos para Profesor</legend>
      <div class="space-y-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Número de empleado</label>
          <input 
            type="text" 
            id="num_empleado" 
            name="num_empleado" 
            inputmode="numeric" 
            maxlength="10"
            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Departamento</label>
          <select 
            id="departamento" 
            name="departamento"
            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
            <option value="">Selecciona un departamento</option>
            <option value="ingles">Inglés</option>
            <option value="frances">Francés</option>
            <option value="italiano">Italiano</option>
            <option value="aleman">Alemán</option>
          </select>
        </div>
      </div>
    </fieldset>

    <button 
      type="submit" 
      class="w-full bg-gray-800 hover:bg-gray-900 text-white font-medium py-2 rounded-md transition"
    >
      Crear y entrar
    </button>
  </form>

  <div class="mt-6 text-center text-sm text-gray-600">
    ¿Ya tienes cuenta? 
    <a href="{{ url_for('auth.login') }}" class="text-blue-600 hover:underline font-medium">Iniciar sesión</a>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const roleSelect = document.getElementById("role");
  const registerForm = document.getElementById("registerForm");
  const alumnoFields = document.getElementById("alumno-fields");
  const staffFields = document.getElementById("staff-fields");
  const numCuenta = document.getElementById("num_cuenta");
  const carrera = document.getElementById("carrera");
  const numEmpleado = document.getElementById("num_empleado");
  const departamento = document.getElementById("departamento");
  const validDepartments = new Set(["ingles", "frances", "italiano", "aleman"]);

  function updateRoleFields() {
    const role = roleSelect.value;
    const isAlumno = role === "alumno";
    const isProfesor = role === "profesor";

    alumnoFields.hidden = !isAlumno;
    staffFields.hidden = !isProfesor;

    numCuenta.required = isAlumno;
    carrera.required = isAlumno;
    numEmpleado.required = isProfesor;
    departamento.required = isProfesor;

    if (isProfesor) {
      numEmpleado.setAttribute("pattern", "\\d{10}");
    } else {
      numEmpleado.removeAttribute("pattern");
    }

    numCuenta.setCustomValidity("");
    numEmpleado.setCustomValidity("");
    departamento.setCustomValidity("");
  }

  function validateRoleRules(event) {
    const role = roleSelect.value;
    const numCuentaValue = numCuenta.value.trim();
    const numEmpleadoValue = numEmpleado.value.trim();
    const departamentoValue = departamento.value.trim().toLowerCase();

    numCuenta.setCustomValidity("");
    numEmpleado.setCustomValidity("");
    departamento.setCustomValidity("");

    if (role === "alumno" && !/^\d{10}$/.test(numCuentaValue)) {
      numCuenta.setCustomValidity("El número de cuenta del alumno debe tener exactamente 10 dígitos.");
      numCuenta.reportValidity();
      event.preventDefault();
      return;
    }

    if (role === "profesor") {
      if (!/^\d{10}$/.test(numEmpleadoValue)) {
        numEmpleado.setCustomValidity("El número de empleado debe tener exactamente 10 dígitos.");
        numEmpleado.reportValidity();
        event.preventDefault();
        return;
      }

      if (!validDepartments.has(departamentoValue)) {
        departamento.setCustomValidity("El departamento debe ser: inglés, francés, italiano o alemán.");
        departamento.reportValidity();
        event.preventDefault();
        return;
      }
    }
  }

  roleSelect.addEventListener("change", updateRoleFields);
  registerForm.addEventListener("submit", validateRoleRules);
  updateRoleFields();
</script>
{% endblock %}
