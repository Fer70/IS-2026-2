{% extends "base.html" %}

{% block title %}Iniciar sesión{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md">
  <h1 class="text-3xl font-bold text-gray-800 mb-6">Iniciar sesión</h1>

  {% if error %}
    <div class="mb-4 p-3 bg-red-100 text-red-700 rounded-md text-sm">
      {{ error }}
    </div>
  {% endif %}

  <form method="post" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
      <input 
        type="text" 
        name="username" 
        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" 
        required
      >
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
      <input 
        type="password" 
        name="password" 
        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" 
        required
      >
    </div>

    <button 
      type="submit" 
      class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-md transition"
    >
      Entrar
    </button>
  </form>

  <div class="mt-6 text-center text-sm text-gray-600">
    ¿No tienes cuenta? 
    <a href="{{ url_for('auth.register') }}" class="text-blue-600 hover:underline font-medium">Crear cuenta</a>
  </div>
</div>
{% endblock %}
