{% extends "base.html" %}

{% block content %}

<div class="min-h-[80vh] flex flex-col justify-center items-center">

    <h1 class="text-5xl font-bold text-blue-600 mb-4">
        Plataforma de cursos
    </h1>

    <p class="text-gray-600 text-lg mb-8">
        Bienvenido. Elige cómo deseas continuar.
    </p>

    <div class="flex gap-4">

        <a
            href="{{ url_for('auth.login') }}"
            class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-lg shadow"
        >
            Iniciar sesión
        </a>

        <a
            href="{{ url_for('auth.register') }}"
            class="bg-gray-800 hover:bg-gray-900 text-white px-6 py-3 rounded-lg shadow"
        >
            Crear cuenta
        </a>

    </div>

</div>

{% endblock %}
